---
# Deploys the loopback-only Prometheus and Grafana stack. It is separate from
# hardening.yml: monitoring is not a hardening domain and opens no port.
- name: Deploy AegisOps monitoring as administrator
  hosts: vps
  become: true
  gather_facts: true
  # Apply restarts even if a later task fails, so changes never stay pending.
  force_handlers: true
  vars_files:
    - - ../hardening-vars.yml
      - ../hardening-vars.yml.example
  vars:
    ansible_user: "{{ users_hardening_admin_username }}"
    ansible_ssh_private_key_file: "{{ ssh_hardening_probe_private_key | default('') }}"

  roles:
    - role: monitoring
