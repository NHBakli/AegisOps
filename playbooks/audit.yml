---
- name: AegisOps | Initial VPS Audit
  hosts: vps
  become: true
  gather_facts: true

  tasks:
    - name: Display operating system information
      ansible.builtin.debug:
        msg:
          - "OS: {{ ansible_facts['distribution'] }}"
          - "Version: {{ ansible_facts['distribution_version'] }}"
          - "Kernel: {{ ansible_facts['kernel'] }}"
          - "Architecture: {{ ansible_facts['architecture'] }}"

    - name: Display memory information
      ansible.builtin.debug:
        msg:
          - "Total RAM: {{ ansible_facts['memtotal_mb'] }} MB"
          - "Free RAM: {{ ansible_facts['memfree_mb'] }} MB"
          - "Used RAM: {{ ansible_facts['memory_mb']['real']['used'] }} MB"

    - name: Collect SSH configuration
      ansible.builtin.command:
        argv:
          - /usr/sbin/sshd
          - -T
      register: ssh_config
      changed_when: false

    - name: Display SSH security settings
      ansible.builtin.debug:
        msg: >-
          {{
            ssh_config.stdout_lines
            | select('match',
                '^(port|permitrootlogin|passwordauthentication|pubkeyauthentication|kbdinteractiveauthentication) ')
            | list
          }}

    - name: Evaluate SSH security settings
      ansible.builtin.set_fact:
        ssh_security_checks:
          root_login:
            status: "{{ 'PASS' if 'permitrootlogin no' in ssh_config.stdout_lines else 'FAIL' }}"
            description: "SSH root login must be disabled"

          password_auth:
            status: "{{ 'PASS' if 'passwordauthentication no' in ssh_config.stdout_lines else 'FAIL' }}"
            description: "SSH password authentication must be disabled"

          pubkey_auth:
            status: "{{ 'PASS' if 'pubkeyauthentication yes' in ssh_config.stdout_lines else 'FAIL' }}"
            description: "SSH public key authentication must be enabled"

          keyboard_interactive:
            status: "{{ 'PASS' if 'kbdinteractiveauthentication no' in ssh_config.stdout_lines else 'FAIL' }}"
            description: "Keyboard-interactive authentication must be disabled"

    - name: Display SSH security assessment
      ansible.builtin.debug:
        var: ssh_security_checks

    - name: Collect local user accounts
      ansible.builtin.getent:
        database: passwd
      changed_when: false

    - name: Collect sudo group information
      ansible.builtin.getent:
        database: group
        key: sudo
      register: sudo_group
      changed_when: false
      failed_when: false

    - name: Identify accounts with UID 0
      ansible.builtin.set_fact:
        root_accounts: >-
          {{
            ansible_facts['getent_passwd']
            | dict2items
            | selectattr('value.1', 'equalto', '0')
            | map(attribute='key')
            | list
          }}

    - name: Display user security information
      ansible.builtin.debug:
        msg:
          - "Ansible SSH user: {{ ansible_user }}"
          - "Accounts with UID 0: {{ root_accounts }}"
          - "Sudo group: {{ ansible_facts.get('getent_group', {}).get('sudo', 'Not found') }}"

    - name: Collect listening network sockets
      ansible.builtin.command:
        argv:
          - ss
          - -tuln
      register: listening_sockets
      changed_when: false

    - name: Display listening network sockets
      ansible.builtin.debug:
        var: listening_sockets.stdout_lines


    - name: Check if UFW is installed
      ansible.builtin.command:
        argv:
          - dpkg-query
          - -W
          - -f=${Status}
          - ufw
      register: ufw_installed
      changed_when: false
      failed_when: false

    - name: Check UFW status
      ansible.builtin.command:
        argv:
          - ufw
          - status
      register: ufw_status
      changed_when: false
      failed_when: false
      when: ufw_installed.rc == 0

    - name: Check if Fail2ban is installed
      ansible.builtin.command:
        argv:
          - dpkg-query
          - -W
          - -f=${Status}
          - fail2ban
      register: fail2ban_installed
      changed_when: false
      failed_when: false

    - name: Check Fail2ban service status
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - fail2ban
      register: fail2ban_status
      changed_when: false
      failed_when: false
      when: fail2ban_installed.rc == 0


    - name: Check unattended-upgrades package
      ansible.builtin.command:
        argv:
          - dpkg-query
          - -W
          - '-f=${Status}'
          - unattended-upgrades
      register: unattended_package
      changed_when: false
      failed_when: false

    - name: Check APT periodic configuration
      ansible.builtin.command:
        argv:
          - apt-config
          - dump
      register: apt_configuration
      changed_when: false

    - name: Check APT update timers
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - apt-daily-upgrade.timer
      register: apt_upgrade_timer
      changed_when: false
      failed_when: false

    - name: Display automatic updates audit
      ansible.builtin.debug:
        msg:
          - "Package installed: {{ unattended_package.rc == 0 and 'install ok installed' in unattended_package.stdout }}"
          - "Upgrade timer: {{ apt_upgrade_timer.stdout | default('unknown', true) }}"
          - "APT periodic settings: {{ apt_configuration.stdout_lines | select('match', '^APT::Periodic::') | list }}"

    - name: Create local reports directory
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../reports"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

    - name: Generate JSON security report
      ansible.builtin.copy:
        content: "{{ security_report | to_nice_json }}"
        dest: "{{ playbook_dir }}/../reports/{{ inventory_hostname }}.json"
        mode: "0600"
      delegate_to: localhost
      become: false
      vars:
        security_report:
          tool: AegisOps
          hostname: "{{ inventory_hostname }}"
          system:
            os: "{{ ansible_facts['distribution'] }}"
            version: "{{ ansible_facts['distribution_version'] }}"
            kernel: "{{ ansible_facts['kernel'] }}"
          ssh:
            root_login: "{{ ssh_security_checks.root_login.status }}"
            password_auth: "{{ ssh_security_checks.password_auth.status }}"
            pubkey_auth: "{{ ssh_security_checks.pubkey_auth.status }}"
            keyboard_interactive: "{{ ssh_security_checks.keyboard_interactive.status }}"