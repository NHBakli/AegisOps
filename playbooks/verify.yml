---
- name: Verify AegisOps security state
  hosts: vps
  become: true
  gather_facts: true
  vars_files:
    - - ../hardening-vars.yml
      - ../hardening-vars.yml.example
  vars:
    ansible_user: "{{ users_hardening_admin_username }}"
    ansible_ssh_private_key_file: "{{ ssh_hardening_probe_private_key }}"

  roles:
    - role: verify
