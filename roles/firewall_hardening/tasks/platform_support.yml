---
- name: Require a validated Ubuntu release before preparing UFW
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Ubuntu'
      - ansible_facts['distribution_version'] in ['22.04', '24.04']
      - not ansible_check_mode
    fail_msg: >-
      UFW preparation supports Ubuntu 22.04 and 24.04 only. Check mode cannot
      verify staged UFW rules; use an isolated test host instead.
