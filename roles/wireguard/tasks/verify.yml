---
# Each query returns public data only; `wg show dump` would print the private key.
- name: Read the running WireGuard public key, port and peers
  ansible.builtin.command:
    argv: [wg, show, "{{ wireguard_interface }}", "{{ item }}"]
  loop: [public-key, listen-port, allowed-ips]
  register: wireguard_show
  changed_when: false

- name: Read the wg0 IPv4 address
  ansible.builtin.command:
    argv: [ip, -4, -o, addr, show, dev, "{{ wireguard_interface }}"]
  register: wireguard_address
  changed_when: false

- name: Read whether the tunnel starts at boot
  ansible.builtin.command:
    argv: [systemctl, is-enabled, "{{ wireguard_unit }}"]
  register: wireguard_enabled
  changed_when: false
  failed_when: false

- name: Read packet forwarding on the VPN interface
  ansible.builtin.command:
    argv: [sysctl, -n, "net.ipv4.conf.{{ wireguard_interface }}.forwarding"]
  register: wireguard_forwarding
  changed_when: false

- name: Check the rule confining peers to the server address
  ansible.builtin.command:
    argv:
      - iptables
      - -t
      - raw
      - -C
      - PREROUTING
      - -i
      - "{{ wireguard_interface }}"
      - "!"
      - -d
      - "{{ wireguard_server_address }}/32"
      - -j
      - DROP
  register: wireguard_confinement
  changed_when: false
  failed_when: false

- name: Read UFW rules
  ansible.builtin.command:
    argv: [ufw, status]
  register: wireguard_ufw_status
  changed_when: false

- name: Require the running tunnel to match the declared configuration
  ansible.builtin.import_tasks: verify_assert.yml
