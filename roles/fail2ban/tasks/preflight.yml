---
- name: Require explicit, supported Fail2ban settings
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Ubuntu'
      - ansible_facts['distribution_version'] == '22.04'
      - not ansible_check_mode
      - fail2ban_hardening_approved_host == inventory_hostname
      - fail2ban_hardening_recovery_confirmed | bool
      - fail2ban_hardening_admin_source_ip is string
      - fail2ban_hardening_admin_source_ip | length > 0
      - fail2ban_hardening_admin_user is match('^[a-z_][a-z0-9_-]{0,30}$')
      - fail2ban_hardening_admin_user != 'root'
      - ansible_user is defined
      - ansible_user == fail2ban_hardening_admin_user
      - fail2ban_hardening_probe_private_key is match('^/[^\\s]+$')
      - fail2ban_hardening_maxretry is integer
      - fail2ban_hardening_maxretry >= 1
      - fail2ban_hardening_findtime is integer
      - fail2ban_hardening_findtime >= 1
      - fail2ban_hardening_bantime is integer
      - fail2ban_hardening_bantime >= 1
      - fail2ban_hardening_banaction == 'iptables-multiport'
      - ansible_port is defined
      - (ansible_port | default('') | string) is match('^[0-9]+$')
      - (ansible_port | default(0) | int) >= 1
      - (ansible_port | default(0) | int) <= 65535
      - ansible_facts['virtualization_type'] is defined
      - >-
        (ansible_facts['virtualization_type'] | default('') | lower)
        not in ['lxc', 'container', 'openvz', 'docker', 'podman']
        or fail2ban_hardening_lxc_compatibility_confirmed | bool
    fail_msg: >-
      Fail2ban requires Ubuntu 22.04, host-specific approval, console recovery,
      a tested non-root administrator with its SSH key and source IP, safe jail
      values, and separate LXC compatibility confirmation. Check mode is
      unsupported when enabled.

- name: Require an IPv4 administrator source and the reserved IPv4 probe
  ansible.builtin.import_tasks: validate_addresses.yml

- name: Read listening IPv6 TCP sockets before changing Fail2ban
  ansible.builtin.slurp:
    src: /proc/net/tcp6
  register: fail2ban_hardening_tcp6

- name: Refuse an SSH listener beyond the IPv4 ban probe's coverage
  ansible.builtin.import_tasks: verify_ipv4_scope.yml

- name: Read effective capabilities before enabling a ban action
  ansible.builtin.slurp:
    src: /proc/self/status
  register: fail2ban_hardening_process_status

- name: Require CAP_NET_ADMIN for the iptables ban action
  ansible.builtin.assert:
    that:
      - >-
        (((fail2ban_hardening_process_status.content | b64decode
          | regex_findall('(?m)^CapEff:\s*([0-9A-Fa-f]+)$') | first | int(base=16))
          // 4096) % 2) == 1
    fail_msg: CAP_NET_ADMIN is unavailable; Fail2ban cannot enforce iptables bans here.
