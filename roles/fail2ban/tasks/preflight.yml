---
- name: Require explicit, supported Fail2ban settings
  ansible.builtin.import_tasks: preflight_inputs.yml

- name: Read listening IPv6 TCP sockets before changing Fail2ban
  ansible.builtin.slurp:
    src: /proc/net/tcp6
  register: fail2ban_hardening_tcp6

- name: Refuse an SSH listener beyond the IPv4 ban probe's coverage
  ansible.builtin.import_tasks: verify_ipv4_scope.yml

- name: Read effective capabilities before enabling a ban action
  ansible.builtin.slurp:
    src: /proc/self/status
  register: fail2ban_hardening_process_status

- name: Require CAP_NET_ADMIN for the iptables ban action
  ansible.builtin.assert:
    that:
      - >-
        (((fail2ban_hardening_process_status.content | b64decode
          | regex_findall('(?m)^CapEff:\s*([0-9A-Fa-f]+)$') | first | int(base=16))
          // 4096) % 2) == 1
    fail_msg: CAP_NET_ADMIN is unavailable; Fail2ban cannot enforce iptables bans here.
