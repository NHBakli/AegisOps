---
- name: Check if Fail2ban is installed
  ansible.builtin.command:
    argv:
      - dpkg-query
      - -W
      - -f=${Status}
      - fail2ban
  register: audit_fail2ban_installed
  changed_when: false
  failed_when: false

- name: Check Fail2ban service status
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - fail2ban
  register: audit_fail2ban_status
  changed_when: false
  failed_when: false
  when: audit_fail2ban_installed.rc == 0

- name: Check if UFW is installed
  ansible.builtin.command:
    argv:
      - dpkg-query
      - -W
      - -f=${Status}
      - ufw
  register: audit_ufw_installed
  changed_when: false
  failed_when: false

- name: Check UFW status
  ansible.builtin.command:
    argv:
      - ufw
      - status
  register: audit_ufw_status
  changed_when: false
  failed_when: false
  when: audit_ufw_installed.rc == 0

- name: Evaluate firewall security
  ansible.builtin.set_fact:
    audit_firewall_security_checks:
      ufw_installed:
        status: "{{ 'PASS' if audit_ufw_installed.rc == 0 and 'install ok installed' in audit_ufw_installed.stdout else 'WARN' }}"
        description: UFW should be installed to manage firewall rules

      ufw_active:
        status: >-
          {{
            'WARN' if audit_ufw_installed.rc != 0 or 'install ok installed' not in audit_ufw_installed.stdout
            else 'REVIEW' if audit_ufw_status.rc != 0
            else 'PASS' if (audit_ufw_status.stdout_lines | first | default('')) == 'Status: active'
            else 'WARN'
          }}
        description: UFW should be active and running

      fail2ban_installed:
        status: "{{ 'PASS' if audit_fail2ban_installed.rc == 0 and 'install ok installed' in audit_fail2ban_installed.stdout else 'WARN' }}"
        description: Fail2ban should be installed to protect against brute-force attacks

      fail2ban_active:
        status: >-
          {{
            'WARN' if audit_fail2ban_installed.rc != 0 or 'install ok installed' not in audit_fail2ban_installed.stdout
            else 'PASS' if (audit_fail2ban_status.stdout | default('') | trim) == 'active'
            else 'WARN' if audit_fail2ban_status.rc in [3, 4]
            else 'REVIEW'
          }}
        description: Fail2ban service should be active and running

- name: Display firewall security assessment
  ansible.builtin.debug:
    var: audit_firewall_security_checks
