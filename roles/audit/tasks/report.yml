---

- name: Create local reports directory
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../reports"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Calculate security audit summary
  ansible.builtin.set_fact:
    audit_summary:
      total: "{{ all_security_checks | length }}"
      passed: "{{ all_security_checks | selectattr('status', 'equalto', 'PASS') | list | length }}"
      failed: "{{ all_security_checks | selectattr('status', 'equalto', 'FAIL') | list | length }}"
      warnings: "{{ all_security_checks | selectattr('status', 'equalto', 'WARN') | list | length }}"
      review: "{{ all_security_checks | selectattr('status', 'equalto', 'REVIEW') | list | length }}"
  vars:
    all_security_checks: >-
      {{
        (
          ssh_security_checks.values() | list
          + user_security_checks.values() | list
          + firewall_security_checks.values() | list
          + updates_security_checks.values() | list
        )
      }}

- name: Generate JSON security report
  ansible.builtin.copy:
    content: "{{ security_report | to_nice_json }}"
    dest: "{{ playbook_dir }}/../reports/{{ inventory_hostname }}.json"
    mode: "0600"
  delegate_to: localhost
  become: false
  vars:
    security_report:
      tool: AegisOps
      hostname: "{{ inventory_hostname }}"
      summary: "{{ audit_summary }}"

      system:
        os: "{{ ansible_facts['distribution'] }}"
        version: "{{ ansible_facts['distribution_version'] }}"
        kernel: "{{ ansible_facts['kernel'] }}"
        architecture: "{{ ansible_facts['architecture'] }}"

      checks:
        ssh: "{{ ssh_security_checks }}"
        users: "{{ user_security_checks }}"
        firewall: "{{ firewall_security_checks }}"
        updates: "{{ updates_security_checks }}"