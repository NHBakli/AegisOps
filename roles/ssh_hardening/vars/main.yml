---
# A direct, uncached, key-only SSH session from the Ansible controller.
ssh_hardening_include_directory_path: /etc/ssh/sshd_config.d
ssh_hardening_probe_argv:
  - ssh
  - -F
  - /dev/null
  - -o
  - BatchMode=yes
  - -o
  - ControlMaster=no
  - -o
  - ControlPath=none
  - -o
  - StrictHostKeyChecking=yes
  - -o
  - IdentitiesOnly=yes
  - -o
  - PreferredAuthentications=publickey
  - -o
  - PasswordAuthentication=no
  - -o
  - KbdInteractiveAuthentication=no
  - -o
  - ConnectTimeout=10
  - -i
  - "{{ ssh_hardening_probe_private_key }}"
  - -p
  - "{{ ansible_port | default(22) | string }}"
  - "{{ ssh_hardening_admin_user }}@{{ ansible_host | default(inventory_hostname) }}"
  - sudo
  - -n
  - /usr/bin/true
