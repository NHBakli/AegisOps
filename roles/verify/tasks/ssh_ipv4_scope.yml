---
- name: Assert no IPv6 listener on the SSH port
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - |
        import sys

        port = int(sys.argv[1])
        for line in sys.argv[2].splitlines()[1:]:
            fields = line.split()
            if len(fields) < 4:
                sys.exit('unreadable IPv6 TCP socket table')
            local_port = int(fields[1].rsplit(':', 1)[1], 16)
            if fields[3] == '0A' and local_port == port:
                sys.exit('SSH still listens on IPv6 despite AddressFamily inet')
      - "{{ ansible_port | string }}"
      - "{{ verify_ssh_tcp6.content | b64decode }}"
  changed_when: false
