---
- name: Confirm the administrator address belongs to an effective ignored network
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - |
        import ipaddress
        import sys

        source = ipaddress.ip_address(sys.argv[1])
        networks = []
        for raw in sys.argv[2].replace(',', ' ').split():
            token = raw.strip('|`-[]\'"')
            try:
                networks.append(ipaddress.ip_network(token, strict=False))
            except ValueError:
                pass
        if not any(source in network for network in networks):
            sys.exit('administrator source is absent from effective ignoreip')
      - "{{ fail2ban_hardening_admin_source_ip }}"
      - "{{ verify_fail2ban_settings.results[0].stdout }}"
  changed_when: false
