---
- name: Require a supported platform and explicit reboot policy
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Ubuntu'
      - ansible_facts['distribution_version'] in ['22.04', '24.04']
      - not ansible_check_mode
      - updates_hardening_include_esm is boolean
      - updates_hardening_automatic_reboot is boolean
      - updates_hardening_reboot_time is match('^([01][0-9]|2[0-3]):[0-5][0-9]$')
      - >-
        not updates_hardening_automatic_reboot
        or (
          updates_hardening_reboot_approved_host == inventory_hostname
          and updates_hardening_recovery_confirmed | bool
        )
    fail_msg: >-
      Automatic updates require Ubuntu 22.04 or 24.04 and a valid policy. Automatic
      reboot also requires host-specific approval and confirmed recovery.
