---
- name: Validate monitoring inputs and memory budget before changes
  ansible.builtin.import_tasks: preflight.yml

- name: Probe host capabilities needed by the services
  ansible.builtin.import_tasks: preflight_host.yml

- name: Pin listeners and memory limits, then install packages
  ansible.builtin.import_tasks: install.yml

- name: Configure Prometheus, Grafana and the security collector
  ansible.builtin.import_tasks: configure.yml

- name: Verify loopback-only exposure and service health
  ansible.builtin.import_tasks: verify.yml
